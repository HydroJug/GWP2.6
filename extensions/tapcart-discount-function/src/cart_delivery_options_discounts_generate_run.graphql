query DeliveryInput {
  cart {
    deliveryGroups {
      id
    }
    attribute(key: "channel") {
      value
    }
    cost {
      subtotalAmount {
        amount
      }
    }
    buyerIdentity {
      customer {
        id
        email
        firstName
        lastName
        amountSpent {
          amount
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "tapcart", key: "discount_config") {
      value
    }
  }
  # "Block all discounts" toggle (app/lib/discountBlock.server.js).
  shop {
    discountBlock: metafield(namespace: "$app:discount_block", key: "config") {
      jsonValue
    }
  }
}
