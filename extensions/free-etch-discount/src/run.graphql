query RunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            productType
          }
        }
      }
      etchInfo: attribute(key: "etchInfo") {
        key
        value
      }
      etchInfoHidden: attribute(key: "_etchInfo") {
        key
        value
      }
    }
  }
  discount {
    # Kept applying while "Block all discounts" is on.
    blockExempt: metafield(namespace: "$app:discount_block", key: "exempt") {
      value
    }
    metafield(namespace: "free_etch", key: "config") {
      value
    }
    discountClasses
  }
  # "Block all discounts" toggle (app/lib/discountBlock.server.js).
  shop {
    discountBlock: metafield(namespace: "$app:discount_block", key: "config") {
      jsonValue
    }
  }
}
