# Gift-with-purchase picker in checkout. See src/Checkout.jsx.

api_version = "2026-10"

[[extensions]]
name = "gift-with-purchase-checkout-ui"
handle = "gift-with-purchase-checkout-ui"
type = "ui_extension"
uid = "6baa3bb1-983e-ec0e-2839-bc3be08e3bbb192e9346"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.actions.render-before"

# GWP tiers and gift variants (storefront copy, written on save).
[[extensions.metafields]]
namespace = "gwp"
key = "config"

# "Block all discounts" flag: hides gift offers while it's on.
[[extensions.metafields]]
namespace = "$app:discount_block"
key = "config"
