query DeliveryInput {
  cart {
    deliveryGroups {
      id
    }
  }
  discount {
    # Kept applying while "Block all discounts" is on.
    blockExempt: metafield(namespace: "$app:discount_block", key: "exempt") {
      value
    }
    discountClasses
  }
  # "Block all discounts" toggle (app/lib/discountBlock.server.js).
  shop {
    discountBlock: metafield(namespace: "$app:discount_block", key: "config") {
      jsonValue
    }
  }
}
