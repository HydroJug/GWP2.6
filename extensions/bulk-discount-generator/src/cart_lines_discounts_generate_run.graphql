query CartInput($collectionIds: [ID!], $eligibilityTags: [String!]) {
  cart {
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
        subtotalAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
            inAnyCollection(ids: $collectionIds)
          }
        }
      }
    }
    buyerIdentity {
      customer {
        id
        hasAnyTag(tags: $eligibilityTags)
      }
    }
  }
  discount {
    # Kept applying while "Block all discounts" is on.
    blockExempt: metafield(namespace: "$app:discount_block", key: "exempt") {
      value
    }
    discountClasses
    metafield(namespace: "bulk_discount", key: "config") {
      value
    }
  }
  # "Block all discounts" toggle (app/lib/discountBlock.server.js).
  shop {
    discountBlock: metafield(namespace: "$app:discount_block", key: "config") {
      jsonValue
    }
  }
}
