query CartInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
  }
  discount {
    metafield(namespace: "buy_more_save_more", key: "config") {
      value
    }
  }
  # "Block all discounts" toggle (app/lib/discountBlock.server.js).
  shop {
    discountBlock: metafield(namespace: "$app:discount_block", key: "config") {
      jsonValue
    }
  }
}
